<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CL-1985 電卓</title>
<link rel="preconnect" href="https://fonts.googlepis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googlepis.com/css2?family=Share+Tech+Mono&family=Inter:wght@500;600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="desk">
        <div class="calcuator">

            <div class="brand-row">
                <span class="brand-name">CL&#8209;1985</span>
                <span class="brand-tag">ELECTRO&#8209;CALC</span>
            </div>

            <div class="screen-bezel">
                <div class="screen">
                    <div class="screen-meta">
                        <span class="solar-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="14" height="14">
                                <rect x="2" y="6" width="20" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                                <line x1="7" y1="6" x2="7" y2="18" stroke="currentColor" stroke-width="1"/>
                                <line x1="12" y1="6" x2="12" y2="18" stroke="currentColor" stroke-width="1"/>
                                <line x1="17" y1="6" x2="17" y2="18" stroke="currentColor" stroke-width="1"/>
                            </svg>
                            <span>SOLAR</span>
                        </span>
                        <span class="status-dot" id="statusDot" title="サーバー接続状態"></span>
                    </div>
                    <div class="expression" id="expression">&nbsp;</div>
                    <div class="display" id="display">0</div>
                </div>
            </div>

            <div class="keys">
                <button class="key key-func" data-action="clear">AC</button>
                <button class="key key-func" data-action="backspace">⌫</button>
                <button class="key key-func" data-action="percent">%</button>
                <button class="key key-op" data-op="÷">÷</button>

                <button class="key key-num" data-digit="7">7</button>
                <button class="key key-num" data-digit="8">8</button>
                <button class="key key-num" data-digit="9">9</button>
                <button class="key key-op" data-op="×">×</button>

                
            </div>
